name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Run Backend Tests
        run: |
          cd backend
          PYTHONPATH=src uv run --locked --group dev python -m unittest discover tests

      - name: Run mypy Type Check
        run: |
          cd backend
          PYTHONPATH=src uv run --locked --group dev mypy src tests

      - name: Run ruff Check
        run: |
          cd backend
          PYTHONPATH=src uv run --locked --group dev ruff check .

      - name: Run ruff Format Check
        run: |
          cd backend
          PYTHONPATH=src uv run --locked --group dev ruff format --check .

  web:
    name: Web Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: |
          cd web
          pnpm run typecheck

      - name: Run Tests
        run: |
          cd web
          pnpm test

      - name: Run Build
        run: |
          cd web
          pnpm run build
